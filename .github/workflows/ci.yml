name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-version

      # A library does not commit composer.lock, so each PHP version resolves
      # the newest dependencies it supports.
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      # The suite is offline (Guzzle MockHandler), so CI does not depend on
      # api.coinpaprika.com being reachable.
      - name: Run tests
        run: vendor/bin/phpunit
